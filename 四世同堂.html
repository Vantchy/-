<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>四世同堂 · 极简版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'KaiTi', '楷体', serif;
            background: #e8dccc;
            display: flex;
            justify-content: center;
            padding: 30px 16px;
        }
        .app {
            max-width: 700px;
            width: 100%;
            background: #f9f2e7;
            border-radius: 24px;
            padding: 24px 20px 30px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid #d6c0aa;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            color: #4d3221;
            letter-spacing: 8px;
            font-weight: normal;
            border-bottom: 2px dashed #c9b094;
            padding-bottom: 12px;
        }
        .yard-buttons {
            display: flex;
            gap: 12px;
            margin: 16px 0;
            justify-content: center;
            flex-wrap: wrap;
        }
        .yard-btn {
            padding: 8px 28px;
            border: 2px solid #dac09a;
            border-radius: 40px;
            background: #fcf6ed;
            cursor: pointer;
            font-size: 1.1rem;
            font-family: inherit;
            transition: 0.2s;
            color: #4d3221;
        }
        .yard-btn.active {
            background: #4d3221;
            color: #f9f2e7;
            border-color: #4d3221;
        }
        .yard-btn:hover {
            transform: translateY(-2px);
        }

        .scene-box {
            background: #fcf6ed;
            border-radius: 16px;
            padding: 18px 20px;
            border: 1px solid #d6c0aa;
            min-height: 120px;
            margin-bottom: 14px;
        }
        .scene-box .desc {
            font-size: 0.98rem;
            line-height: 1.8;
            color: #3f2c1d;
            font-style: italic;
        }
        .scene-box .time {
            font-size: 0.75rem;
            color: #a58366;
            margin-bottom: 6px;
        }

        .people-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0 4px;
        }
        .person-tag {
            background: #ede3d5;
            border: 1px solid #d6c0aa;
            border-radius: 30px;
            padding: 4px 16px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
            font-family: inherit;
        }
        .person-tag:hover {
            background: #dccfc0;
            transform: scale(1.04);
        }

        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        #modal.active {
            display: flex;
        }
        #modal-box {
            background: #fcf6ed;
            max-width: 440px;
            width: 92%;
            border-radius: 24px;
            padding: 28px 30px;
            border: 1px solid #dac09a;
            position: relative;
        }
        #modal-box .close {
            position: absolute;
            top: 10px;
            right: 18px;
            font-size: 1.6rem;
            cursor: pointer;
            border: none;
            background: none;
            color: #a58366;
        }
        #modal-box .mname {
            font-size: 1.6rem;
            color: #3f2c1d;
            border-bottom: 2px dotted #dac09a;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }
        #modal-box .mbody {
            font-size: 0.96rem;
            line-height: 1.9;
            color: #3f2c1d;
            max-height: 320px;
            overflow-y: auto;
        }
        .loading {
            color: #a58366;
            font-style: italic;
        }
        .error {
            color: #b34a4a;
        }
    </style>
</head>
<body>

    <div class="app">
        <h1>四世同堂</h1>
        <p style="text-align:center;color:#8e735b;letter-spacing:2px;margin:6px 0 10px;">· 小羊圈胡同 ·</p>

        <!-- 三个院子按钮 -->
        <div class="yard-buttons">
            <button class="yard-btn active" data-scene="qi">🏠 祁家</button>
            <button class="yard-btn" data-scene="qian">📖 钱家</button>
            <button class="yard-btn" data-scene="guan">🎩 冠家</button>
        </div>

        <!-- 场景展示 -->
        <div class="scene-box" id="sceneBox">
            <div class="time" id="sceneTime">北平 · 沦陷前夕</div>
            <div class="desc" id="sceneDesc">加载中……</div>
        </div>

        <div style="font-size:0.8rem;color:#8e735b;margin:2px 0 4px;">👥 点击人物查看介绍</div>
        <div class="people-list" id="peopleList"></div>
    </div>

    <!-- 弹窗 -->
    <div id="modal">
        <div id="modal-box">
            <button class="close" id="modalClose">✕</button>
            <div class="mname" id="modalName">祁瑞宣</div>
            <div class="mbody" id="modalBody"><span class="loading">📖 加载中……</span></div>
        </div>
    </div>

    <script>
        // ============================================================
        //  数据
        // ============================================================
        const DATA = {
            qi: {
                time: '北平 · 沦陷前夕',
                desc: '「祁家的院子深处，四代人聚居于此。祁老太爷坐在藤椅上，看着重孙辈在枣树下追逐，念叨着：四世同堂，这是福气啊。」',
                people: ['祁老太爷', '祁天佑', '祁瑞宣', '祁瑞丰', '祁瑞全', '韵梅', '小顺子']
            },
            qian: {
                time: '北平 · 暗流涌动',
                desc: '「钱家的院子小而清雅，墙角的竹子青翠。钱默吟先生常坐窗前读诗，茶凉了也不觉。他是胡同里最有风骨的人。」',
                people: ['钱默吟', '钱太太', '钱仲石']
            },
            guan: {
                time: '北平 · 浮华之日',
                desc: '「冠家的院子最体面，石狮子锃亮。冠晓荷爱在院里放留声机，梅兰芳的唱腔飘过墙头，有人羡慕，有人不齿。」',
                people: ['冠晓荷', '大赤包', '冠招弟', '高亦陀']
            }
        };

        // ============================================================
        //  场景切换
        // ============================================================
        let currentScene = 'qi';

        function renderScene(key) {
            currentScene = key;
            const d = DATA[key];
            if (!d) return;

            document.getElementById('sceneTime').textContent = d.time;
            document.getElementById('sceneDesc').textContent = d.desc;

            // 按钮高亮
            document.querySelectorAll('.yard-btn').forEach(b => b.classList.toggle('active', b.dataset.scene === key));

            // 渲染人物标签
            const list = document.getElementById('peopleList');
            list.innerHTML = '';
            d.people.forEach(name => {
                const tag = document.createElement('button');
                tag.className = 'person-tag';
                tag.textContent = name;
                tag.onclick = () => openModal(name);
                list.appendChild(tag);
            });
        }

        document.querySelectorAll('.yard-btn').forEach(btn => {
            btn.onclick = () => renderScene(btn.dataset.scene);
        });

        // ============================================================
        //  DeepSeek API（请填入你的 Key）
        // ============================================================
        const API_KEY = 'sk-729a65bad56b4712a59f56d32c300c96';
        const API_URL = 'https://api.deepseek.com/v1/chat/completions';

        // ============================================================
        //  弹窗
        // ============================================================
        const modal = document.getElementById('modal');
        const modalName = document.getElementById('modalName');
        const modalBody = document.getElementById('modalBody');

        function openModal(name) {
            modal.classList.add('active');
            modalName.textContent = name;
            modalBody.innerHTML = '<span class="loading">📖 DeepSeek 正在讲述……</span>';
            fetchStory(name);
        }

        document.getElementById('modalClose').onclick = () => modal.classList.remove('active');
        modal.onclick = e => { if (e.target === modal) modal.classList.remove('active'); };

        async function fetchStory(name) {
            const prompt =
                `你是老舍《四世同堂》的文学专家。请为「${name}」写一段150~200字的介绍：性格特点、关键经历、一句贴合人物的台词。直接输出内容，不要加开头语。`;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.8,
                        max_tokens: 500
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || '请求失败');
                modalBody.textContent = data.choices[0].message.content;
            } catch (e) {
                modalBody.innerHTML = `<span class="error">❌ ${e.message}<br><br>检查：Key是否正确？网络是否畅通？</span>`;
            }
        }

        // ============================================================
        //  初始化
        // ============================================================
        renderScene('qi');

        if (API_KEY === '你的DeepSeek-API-Key') {
            console.warn('⚠️ 请填入你的 DeepSeek API Key');
        }
    </script>

</body>
</html>
